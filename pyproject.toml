[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "in-silico-recsys"
version = "0.1.0"
description = "Robust RL for RecSys via In Silico LLM Personas"
authors = [{ name = "Brandon Tran", email = "brandon.tran@yale.edu" }]
dependencies = [
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0"
]
